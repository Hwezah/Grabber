name: Build APKs

# On every push to dev (or main): unit tests, debug APKs per ABI plus universal, published on the
# fixed "grabber-latest" pre-release so the phone can always download the newest build from one link.

on:
  push:
    branches: ["dev", "main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Unit tests
        run: ./gradlew --no-daemon :engine:http:test testDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew --no-daemon -PuniversalApk assembleDebug

      - name: Name the APKs
        shell: bash
        run: |
          mkdir -p out
          for apk in app/build/outputs/apk/debug/app-*-debug.apk; do
            abi=$(basename "$apk" -debug.apk); abi=${abi#app-}
            # Fixed names: the same link always downloads the newest build.
            cp "$apk" "out/Grabber-$abi.apk"
          done
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          if-no-files-found: error

      - name: Publish to the grabber-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          notes="Latest build from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}, built $(date -u '+%Y-%m-%d %H:%M UTC'), versionCode $((100 + GITHUB_RUN_NUMBER)). Most phones: download **Grabber-arm64-v8a.apk**. Not sure? Take **Grabber-universal.apk**."
          notes="$notes"$'\n\n'"What's new: $(git log -1 --pretty=%s)"
          if gh release view grabber-latest > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/grabber-latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            for name in $(gh release view grabber-latest --json assets -q '.assets[].name'); do
              gh release delete-asset grabber-latest "$name" --yes
            done
            gh release upload grabber-latest out/*.apk --clobber
            gh release edit grabber-latest --notes "$notes" --prerelease --target "$GITHUB_SHA"
          else
            gh release create grabber-latest out/*.apk --prerelease --title "Grabber — latest build" --notes "$notes" --target "$GITHUB_SHA"
          fi
